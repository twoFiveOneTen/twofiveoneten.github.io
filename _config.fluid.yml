# Fluid theme configuration
# Schema: see node_modules/hexo-theme-fluid/_config.yml after npm install
# Doc: https://github.com/fluid-dev/hexo-theme-fluid

# Home page banner (uses index.* keys, NOT banner.home.*)
index:
  banner_img: /img/global/bg.png
  banner_img_height: 50
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text: '分享点滴学习，记录成长足迹'

# Local search (theme-side enable; index generated by hexo-generator-search)
search:
  enable: true

# Code block copy button + highlight
code:
  copy_btn: true
  highlight:
    enable: true
    line_number: false

# Post meta: date + word count + reading time
post:
  meta:
    date:
      enable: true
    wordcount:
      enable: true
    min2read:
      enable: true

# Custom primary color (carried over from Jekyll yat theme banner background)
color:
  main_color: '#1a1a2e'

footer:
  enable: true
