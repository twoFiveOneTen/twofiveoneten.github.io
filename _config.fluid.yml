# Fluid theme configuration
# Schema: see node_modules/hexo-theme-fluid/_config.yml after npm install
# Doc: https://github.com/fluid-dev/hexo-theme-fluid

# Browser and touch icon
favicon: /favicon.ico
apple_touch_icon: /favicon.ico

# Home page banner (uses index.* keys, NOT banner.home.*)
index:
  # 留空会被 url_for() 解析成站点根路径 '/'，导致浏览器把首页 HTML 当图片再请求一次；
  # 用一个空的 data URI 既不发起额外请求，也不会渲染出图片，只剩下纯色遮罩块
  banner_img: 'data:,'
  banner_img_height: 50
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text: '分享点滴学习，记录成长足迹'

# Local search (theme-side enable; index generated by hexo-generator-search)
search:
  enable: true

# Code block copy button + highlight
code:
  copy_btn: true
  highlight:
    enable: true
    line_number: false

# Post meta: date + word count + reading time
post:
  meta:
    date:
      enable: true
    wordcount:
      enable: true
    min2read:
      enable: true

# Custom colors (navbar bg carried over from Jekyll yat theme banner background)
color:
  navbar_bg_color: '#1a1a2e'

# Disable footer statistics counter (was inherited from Jekyll; Fluid has no top-level enable)
footer:
  statistics:
    enable: false

# Navbar — override the default 'Fluid' blog title with our site title
navbar:
  blog_title: "zkk's blog"

# About page (overrides Fluid's "Fluid" / "An elegant theme for Hexo" defaults)
about:
  enable: true
  avatar: /img/avatar.ico
  name: "zkk"
  intro: "分享点滴学习，记录成长足迹"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/twofiveoneten", tip: "GitHub" }
    - { class: "iconfont icon-mail-fill", link: "mailto:zhang.kangkang@outlook.com", tip: "邮箱" }
