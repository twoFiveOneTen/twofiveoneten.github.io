# Site
title: "zkk's blog"
subtitle: '分享点滴学习，记录成长足迹'
description: '我的个人在线笔记本'
author: zkk
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://note.zkk.me
root: /
permalink: :year/:month/:day/:title/

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  nofollow: true

# Markdown
marked:
  gfm: true
  breaks: false

# Theme
theme: fluid

# Feed (replaces jekyll-feed)
feed:
  type: atom
  path: atom.xml
  limit: 20

# Search (powers Fluid local search — valid keys: path, field, content, template)
search:
  path: local-search.xml
  field: post
  content: true

# Deployment (informational; actual deploy via GitHub Actions)
deploy:
  type: ''
